    let impostorLines = [];
    let impostorCount = 0;
    let impostorChecked = false;
    let impostorScore = null;
    let impostorAttempts = 0;

    function getImpostorSubstitute(word) {
      const lower = word.toLowerCase();
      if (IMPOSTOR_SUBSTITUTE_POOL[lower]) {
        const opts = IMPOSTOR_SUBSTITUTE_POOL[lower];
        const chosen = opts[Math.floor(Math.random() * opts.length)];
        if (word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase()) {
          return chosen.charAt(0).toUpperCase() + chosen.slice(1);
        }
        return chosen;
      }
      return null;
    }

    function buildImpostorData(poem) {
      const rawLines = (poem.content || '')
        .normalize('NFC')
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

      const targetImpostors = Math.min(Math.max(2, Math.floor(rawLines.length * 0.4)), 5);
      const candidates = [];

      rawLines.forEach((line, lIdx) => {
        const words = line.split(/\s+/).filter(w => w.length > 0);
        words.forEach((rawWord, wIdx) => {
          const clean = rawWord.replace(/[.,!?;:"'()«»\[\]…—–]+/g, '');
          const sub = getImpostorSubstitute(clean);
          if (sub && clean.length > 1 && sub !== clean) {
            candidates.push({ lineIdx: lIdx, wordIdx: wIdx, word: rawWord, sub });
          }
        });
      });

      if (candidates.length < targetImpostors) {
        const fallbackPool = ['xanh', 'ngát', 'thơm', 'êm', 'tươi', 'nhớ', 'vui', 'sáng', 'ấm', 'mới'];
        rawLines.forEach((line, lIdx) => {
          const words = line.split(/\s+/).filter(w => w.length > 0);
          words.forEach((rawWord, wIdx) => {
            const clean = rawWord.replace(/[.,!?;:"'()«»\[\]…—–]+/g, '');
            if (clean.length >= 3 && !candidates.some(c => c.lineIdx === lIdx && c.wordIdx === wIdx)) {
              const sub = fallbackPool[Math.floor(Math.random() * fallbackPool.length)];
              if (sub !== clean.toLowerCase()) {
                candidates.push({ lineIdx: lIdx, wordIdx: wIdx, word: rawWord, sub });
              }
            }
          });
        });
      }

      const shuffled = shuffleArray(candidates);
      const chosen = shuffled.slice(0, targetImpostors);
      const chosenSet = new Set(chosen.map(c => `${c.lineIdx}-${c.wordIdx}`));

      const lines = rawLines.map((line, lIdx) => {
        const words = line.split(/\s+/).filter(w => w.length > 0);
        return words.map((rawWord, wIdx) => {
          const key = `${lIdx}-${wIdx}`;
          const chosenEntry = chosen.find(c => c.lineIdx === lIdx && c.wordIdx === wIdx);
          if (chosenSet.has(key) && chosenEntry) {
            return {
              lineIndex: lIdx,
              wordIndex: wIdx,
              text: chosenEntry.sub,
              isImpostor: true,
              isSelected: false,
              isRevealed: false,
              originalWord: rawWord
            };
          }
          return {
            lineIndex: lIdx,
            wordIndex: wIdx,
            text: rawWord,
            isImpostor: false,
            isSelected: false,
            isRevealed: false,
            originalWord: rawWord
          };
        });
      });

      return { lines, count: chosen.length };
    }

    function initImpostorGame() {
      const data = buildImpostorData(currentPoem);
      impostorLines = data.lines;
      impostorCount = data.count;
      impostorChecked = false;
      impostorScore = null;
      renderImpostorGame();
    }

    function renderImpostorGame() {
      const container = document.getElementById('impostorModeContainer');
      if (!container) return;

      const selectedCount = impostorLines.flat().filter(w => w.isSelected).length;

      let html = `
        <div class="impostor-game-container">
          <div class="impostor-header">
            <div class="impostor-header-left">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B83A3A" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <div>
                <h2 class="impostor-title">🔍 Thám tử bắt lỗi</h2>
                <p class="impostor-subtitle">
                  Bài thơ đã bị kẻ xấu xâm nhập! Có <strong>${impostorCount} từ bị thay sai</strong>. Hãy click vào chúng để đánh dấu.
                </p>
              </div>
            </div>
            <div class="impostor-header-right">
              <div class="impostor-status-pill">
                Đã chọn: <strong style="color: var(--color-amber-dark); margin-left:4px;">${selectedCount}</strong>
              </div>
              ${impostorAttempts > 0 ? `
                <div class="impostor-status-pill" style="color: var(--color-ink-light); font-size: 0.82rem;">
                  Lần thử: ${impostorAttempts}
                </div>
              ` : ''}
            </div>
          </div>

          ${!impostorChecked ? `
            <div class="impostor-hint-bar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D5A85F" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>Click vào từ bạn nghi ngờ là <em>từ bị thay sai</em> (sẽ sáng viền vàng). Nhấn <strong>Kiểm tra</strong> khi xong.</span>
            </div>
          ` : ''}

          ${impostorChecked && impostorScore ? `
            <div class="impostor-result-banner ${impostorScore.correct === impostorScore.total ? 'result-perfect' : impostorScore.correct >= Math.ceil(impostorScore.total * 0.6) ? 'result-good' : 'result-try-again'}">
              ${impostorScore.correct === impostorScore.total ? `
                🏆 Xuất sắc! Em đã bắt đúng toàn bộ <strong>${impostorScore.correct}/${impostorScore.total}</strong> từ lỗi!
              ` : `
                ⚠️ Bắt được <strong>${impostorScore.correct}/${impostorScore.total}</strong> từ lỗi. Từ lỗi còn sót đang hiển thị màu đỏ với mũi tên đáp án bên dưới.
              `}
            </div>
          ` : ''}

          <div class="impostor-parchment">
            <div class="poem-header-meta" style="margin-bottom: 16px;">
              <h3 class="poem-title-display" style="font-size: 1.45rem;">${currentPoem.title}</h3>
              ${currentPoem.author ? `<p class="poem-author-display">— ${currentPoem.author} —</p>` : ''}
            </div>

            <div class="impostor-lines">
              ${impostorLines.map((line, lIdx) => `
                <div class="impostor-line-row">
                  <span class="line-number-badge">${lIdx + 1}</span>
                  <div class="impostor-words-wrapper">
                    ${line.map((w, wIdx) => {
                      let cls = 'impostor-word';
                      if (impostorChecked && w.isRevealed) {
                        if (w.isImpostor && w.isSelected) cls += ' word-caught-correct';
                        else if (w.isImpostor && !w.isSelected) cls += ' word-missed-impostor';
                        else if (!w.isImpostor && w.isSelected) cls += ' word-wrong-selection';
                      } else {
                        if (w.isSelected) cls += ' word-suspected';
                      }

                      return `
                        <span class="${cls}" onclick="handleImpostorWordClick(${lIdx}, ${wIdx})">
                          ${w.text}
                          ${impostorChecked && w.isImpostor && w.isRevealed ? `
                            <span class="word-correct-tooltip">→ ${w.originalWord}</span>
                          ` : ''}
                        </span>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="impostor-controls">
            <button class="btn btn-secondary" onclick="switchGameMode('rescue')">← Về Giải cứu vần thơ</button>
            <button class="btn btn-secondary" onclick="initImpostorGame()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              <span>Đổi bộ từ lỗi mới</span>
            </button>
            ${!impostorChecked ? `
              <button class="btn btn-primary" onclick="checkImpostors()" ${selectedCount === 0 ? 'disabled style="opacity:0.5;"' : ''}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Kiểm tra (${selectedCount} từ đã chọn)</span>
              </button>
            ` : `
              <button class="btn btn-amber" onclick="initImpostorGame()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                <span>Chơi lại từ đầu</span>
              </button>
            `}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function handleImpostorWordClick(lIdx, wIdx) {
      if (impostorChecked) return;
      const word = impostorLines[lIdx][wIdx];
      word.isSelected = !word.isSelected;
      sound.pick();
      renderImpostorGame();
    }

    function checkImpostors() {
      const allWords = impostorLines.flat();
      const selectedImpostors = allWords.filter(w => w.isSelected && w.isImpostor).length;

      impostorChecked = true;
      impostorScore = { correct: selectedImpostors, total: impostorCount };
      impostorLines.forEach(line => line.forEach(w => w.isRevealed = true));
      impostorAttempts++;

      const pct = selectedImpostors / Math.max(impostorCount, 1);
      if (pct >= 0.8) {
        sound.fanfare();
        triggerConfetti();
      } else if (pct >= 0.5) {
        sound.correct();
      } else {
        sound.wrong();
      }

      renderImpostorGame();
    }

    // ═══════════════════════════════════════════════════════════
    // CHẾ ĐỘ 3: XẾP LẠI HÀNG NGŨ (SORT LINES)
    // ═══════════════════════════════════════════════════════════
    let sortLines = [];
    let sortLinesChecked = false;
    let sortLinesScore = null;
    let sortLinesSelectedIdx = null;
    let sortLinesDraggedIdx = null;
    let sortLinesDragOverIdx = null;

    function initSortLinesGame() {
      const rawLines = (currentPoem.content || '')
        .normalize('NFC')
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

      const original = rawLines.map((text, idx) => ({
        id: `line-${idx}-${Math.random().toString(36).slice(2, 6)}`,
        text,
        originalIndex: idx,
        currentIndex: idx
      }));

      let shuffled = [...original];
      let attempts = 0;
      do {
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        attempts++;
      } while (shuffled.every((l, i) => l.originalIndex === i) && attempts < 20);

      sortLines = shuffled.map((l, i) => ({ ...l, currentIndex: i }));
      sortLinesChecked = false;
      sortLinesScore = null;
      sortLinesSelectedIdx = null;
      sortLinesDraggedIdx = null;
      sortLinesDragOverIdx = null;

      renderSortLinesGame();
    }

    function renderSortLinesGame() {
      const container = document.getElementById('sortLinesModeContainer');
      if (!container) return;

      let html = `
        <div class="sort-lines-container">
          <div class="sort-lines-header">
            <div class="sort-lines-header-left">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4CB9" stroke-width="2">
                <circle cx="9" cy="12" r="1"></circle>
                <circle cx="9" cy="5" r="1"></circle>
                <circle cx="9" cy="19" r="1"></circle>
                <circle cx="15" cy="12" r="1"></circle>
                <circle cx="15" cy="5" r="1"></circle>
                <circle cx="15" cy="19" r="1"></circle>
              </svg>
              <div>
                <h2 class="sort-lines-title">🔀 Xếp lại hàng ngũ</h2>
                <p class="sort-lines-subtitle">
                  Các câu thơ đã bị xáo trộn! Kéo thả, chạm 2 câu để đổi chỗ hoặc dùng nút ▲ ▼ để sắp xếp lại đúng trật tự.
                </p>
              </div>
            </div>
            ${sortLinesChecked && sortLinesScore ? `
              <div class="sort-lines-score-pill ${sortLinesScore.correct === sortLinesScore.total ? 'score-perfect' : sortLinesScore.correct >= sortLinesScore.total * 0.7 ? 'score-good' : 'score-retry'}">
                ${sortLinesScore.correct}/${sortLinesScore.total} câu đúng vị trí
              </div>
            ` : ''}
          </div>

          ${!sortLinesChecked ? `
            <div class="impostor-hint-bar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D5A85F" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>Kéo thả câu thơ lên/xuống, hoặc <strong>chạm chọn câu thứ nhất ➔ chạm câu thứ hai</strong> để hoán đổi. Nhấn <strong>Kiểm tra</strong> khi xong.</span>
            </div>
          ` : ''}

          ${sortLinesChecked && sortLinesScore ? `
            <div class="impostor-result-banner ${sortLinesScore.correct === sortLinesScore.total ? 'result-perfect' : sortLinesScore.correct >= Math.ceil(sortLinesScore.total * 0.7) ? 'result-good' : 'result-try-again'}">
              ${sortLinesScore.correct === sortLinesScore.total ? `
                🏆 Hoàn hảo! Em đã xếp đúng tất cả <strong>${sortLinesScore.total}</strong> câu thơ!
              ` : `
                ⚠️ Có <strong>${sortLinesScore.correct}/${sortLinesScore.total}</strong> câu đúng vị trí. Những câu chưa đúng đang hiện màu cam kèm gợi ý.
              `}
            </div>
          ` : ''}

          <div class="sort-lines-parchment">
            <div class="poem-header-meta" style="margin-bottom: 12px;">
              <h3 class="poem-title-display" style="font-size: 1.45rem;">${currentPoem.title}</h3>
              ${currentPoem.author ? `<p class="poem-author-display">— ${currentPoem.author} —</p>` : ''}
            </div>

            <div class="sort-lines-list">
              ${sortLines.map((line, idx) => {
                const isCorrect = sortLinesChecked && line.originalIndex === idx;
                const isWrong = sortLinesChecked && line.originalIndex !== idx;
                const isSelected = sortLinesSelectedIdx === idx;
                const isDragging = sortLinesDraggedIdx === idx;
                const isDragOver = sortLinesDragOverIdx === idx;

                let cls = 'sort-line-item';
                if (isDragging) cls += ' sort-line-dragging';
                if (isDragOver) cls += ' sort-line-dragover';
                if (isSelected) cls += ' sort-line-selected';
                if (isCorrect) cls += ' sort-line-correct';
                if (isWrong) cls += ' sort-line-wrong';

                return `
                  <div
                    class="${cls}"
                    draggable="${!sortLinesChecked}"
                    onclick="handleSortLineClick(${idx})"
                    ondragstart="handleSortLineDragStart(event, ${idx})"
                    ondragover="handleSortLineDragOver(event, ${idx})"
                    ondrop="handleSortLineDrop(event, ${idx})"
                    ondragend="handleSortLineDragEnd()"
                  >
                    <div class="sort-line-drag-handle" title="Kéo để di chuyển">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${isCorrect ? '#2A8754' : isWrong ? '#D97706' : '#A89B8C'}" stroke-width="2">
                        <circle cx="9" cy="12" r="1"></circle>
                        <circle cx="9" cy="5" r="1"></circle>
                        <circle cx="9" cy="19" r="1"></circle>
                        <circle cx="15" cy="12" r="1"></circle>
                        <circle cx="15" cy="5" r="1"></circle>
                        <circle cx="15" cy="19" r="1"></circle>
                      </svg>
                      <span class="sort-line-number">${idx + 1}</span>
                    </div>

                    <div class="sort-line-text">
                      ${line.text}
                      ${isWrong && sortLinesChecked ? `
                        <span class="sort-line-hint"> (vị trí đúng: câu ${line.originalIndex + 1})</span>
                      ` : ''}
                    </div>

                    ${!sortLinesChecked ? `
                      <div class="sort-line-arrows">
                        <button class="sort-arrow-btn" onclick="event.stopPropagation(); moveSortLine(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Di chuyển lên">▲</button>
                        <button class="sort-arrow-btn" onclick="event.stopPropagation(); moveSortLine(${idx}, 1)" ${idx === sortLines.length - 1 ? 'disabled' : ''} title="Di chuyển xuống">▼</button>
                      </div>
                    ` : `
                      <div class="sort-line-status">
                        ${isCorrect ? '✅' : '❌'}
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="impostor-controls">
            <button class="btn btn-secondary" onclick="switchGameMode('rescue')">← Về Giải cứu vần thơ</button>
            <button class="btn btn-secondary" onclick="initSortLinesGame()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              <span>Xáo trộn lại</span>
            </button>
            ${!sortLinesChecked ? `
              <button class="btn btn-primary" onclick="checkSortLines()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Kiểm tra thứ tự</span>
              </button>
            ` : `
              <button class="btn btn-amber" onclick="initSortLinesGame()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                <span>Chơi lại</span>
              </button>
            `}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function swapSortLines(fromIdx, toIdx) {
      const arr = [...sortLines];
      [arr[fromIdx], arr[toIdx]] = [arr[toIdx], arr[fromIdx]];
      sortLines = arr.map((l, i) => ({ ...l, currentIndex: i }));
      sound.snap();
      renderSortLinesGame();
    }

    function handleSortLineClick(idx) {
      if (sortLinesChecked) return;
      if (sortLinesSelectedIdx === null) {
        sortLinesSelectedIdx = idx;
        sound.pick();
        renderSortLinesGame();
      } else if (sortLinesSelectedIdx === idx) {
        sortLinesSelectedIdx = null;
        renderSortLinesGame();
      } else {
        const from = sortLinesSelectedIdx;
        sortLinesSelectedIdx = null;
        swapSortLines(from, idx);
      }
    }

    function moveSortLine(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= sortLines.length) return;
      swapSortLines(idx, target);
    }

    function handleSortLineDragStart(e, idx) {
      sortLinesDraggedIdx = idx;
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleSortLineDragOver(e, idx) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (sortLinesDraggedIdx !== null && sortLinesDraggedIdx !== idx) {
        if (sortLinesDragOverIdx !== idx) {
          sortLinesDragOverIdx = idx;
          renderSortLinesGame();
        }
      }
    }

    function handleSortLineDrop(e, targetIdx) {
      e.preventDefault();
      if (sortLinesDraggedIdx !== null && sortLinesDraggedIdx !== targetIdx) {
        swapSortLines(sortLinesDraggedIdx, targetIdx);
      }
      sortLinesDraggedIdx = null;
      sortLinesDragOverIdx = null;
      renderSortLinesGame();
    }

    function handleSortLineDragEnd() {
      sortLinesDraggedIdx = null;
      sortLinesDragOverIdx = null;
      renderSortLinesGame();
    }

    function checkSortLines() {
      const correctCount = sortLines.filter((l, i) => l.originalIndex === i).length;
      const total = sortLines.length;

      sortLinesChecked = true;
      sortLinesScore = { correct: correctCount, total };

      const pct = correctCount / total;
      if (pct === 1) {
        sound.fanfare();
        triggerConfetti();
      } else if (pct >= 0.7) {
        sound.correct();
      } else {
        sound.wrong();
      }

      renderSortLinesGame();
    }

    // ═══════════════════════════════════════════════════════════
    // CHẾ ĐỘ 4: MỰC TÀNG HÌNH (INK FADER)
    // ═══════════════════════════════════════════════════════════
    let inkFaderLevel = 1;
    let inkFaderRevealed = new Set();
    let inkFaderShowAll = false;

    const INK_FADER_LEVEL_CONFIG = {
      1: {
        label: 'Cấp 1 — Gợi nhớ',
        description: 'Ẩn 25% từ cuối câu (vần chân)',
        icon: '🌤',
        color: '#377F78'
      },
      2: {
        label: 'Cấp 2 — Tăng tốc',
        description: 'Ẩn 50% từ trong mỗi câu',
        icon: '🌥',
        color: '#D5A85F'
      },
      3: {
        label: 'Cấp 3 — Thử thách',
        description: 'Chỉ hiện chữ cái đầu của mỗi từ',
        icon: '☁️',
        color: '#B83A3A'
      },
      4: {
        label: 'Cấp 4 — Bậc thầy',
        description: 'Ẩn hoàn toàn — Thuộc lòng 100%',
        icon: '🌫',
        color: '#4D4033'
      }
    };

    function maskInkFaderWord(word, level, wordIdx, totalWords) {
      const leadMatch = word.match(/^([.,!?;:"'()«»\[\]…—–]+)/);
      const trailMatch = word.match(/([.,!?;:"'()«»\[\]…—–]+)$/);
      const lead = leadMatch ? leadMatch[1] : '';
      const trail = trailMatch ? trailMatch[1] : '';
      const core = word.slice(lead.length, word.length - trail.length);

      let masked = core;
      if (level === 1) {
        const hideFrom = Math.max(0, Math.floor(totalWords * 0.75));
        if (wordIdx >= hideFrom) masked = '___';
      } else if (level === 2) {
        if (wordIdx % 2 === 0) masked = '___';
      } else if (level === 3) {
        if (core.length > 0) masked = core.charAt(0).toUpperCase() + '···';
      } else if (level === 4) {
        masked = '▪▪▪';
      }

      return lead + masked + trail;
    }

    function initInkFaderGame() {
      inkFaderRevealed = new Set();
      inkFaderShowAll = false;
      renderInkFaderGame();
    }

    function renderInkFaderGame() {
      const container = document.getElementById('inkFaderModeContainer');
      if (!container) return;

      const rawLines = (currentPoem.content || '')
        .normalize('NFC')
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

      const cfg = INK_FADER_LEVEL_CONFIG[inkFaderLevel];

      let html = `
        <div class="inkfader-container">
          <div class="inkfader-header">
            <div class="inkfader-header-left">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A5C54" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <div>
                <h2 class="inkfader-title">🌫 Mực tàng hình</h2>
                <p class="inkfader-subtitle">Luyện thuộc lòng bài thơ theo từng cấp độ ẩn từ tăng dần</p>
              </div>
            </div>
          </div>

          <div class="inkfader-level-selector">
            ${[1, 2, 3, 4].map(lv => {
              const c = INK_FADER_LEVEL_CONFIG[lv];
              const isActive = inkFaderLevel === lv;
              return `
                <button
                  class="inkfader-level-btn ${isActive ? 'level-active' : ''}"
                  onclick="setInkFaderLevel(${lv})"
                  style="${isActive ? `border-color: ${c.color}; background: ${c.color}14;` : ''}"
                >
                  <span class="level-icon">${c.icon}</span>
                  <div class="level-info">
                    <strong style="color: ${isActive ? c.color : 'var(--color-ink)'}">${c.label}</strong>
                    <span>${c.description}</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>

          <div class="inkfader-tip-bar">
            <span>${cfg.icon} <strong>${cfg.label}:</strong> ${cfg.description}</span>
            <span style="color: var(--color-ink-faint); font-size: 0.85rem;">
              Nhấp vào câu thơ để lật mở · Luyện đọc to trước khi mở
            </span>
          </div>

          <div class="inkfader-parchment">
            <div class="poem-header-meta" style="margin-bottom: 16px;">
              <h3 class="poem-title-display" style="font-size: 1.45rem;">${currentPoem.title}</h3>
              ${currentPoem.author ? `<p class="poem-author-display">— ${currentPoem.author} —</p>` : ''}
            </div>

            <div class="inkfader-lines">
              ${rawLines.map((line, lIdx) => {
                const words = line.split(/\s+/).filter(w => w.length > 0);
                const isLineRevealed = inkFaderRevealed.has(lIdx) || inkFaderShowAll;

                return `
                  <div
                    class="inkfader-line-row ${isLineRevealed ? 'line-revealed' : 'line-masked'}"
                    onclick="toggleInkFaderLine(${lIdx})"
                    title="${isLineRevealed ? 'Nhấp để che lại' : 'Nhấp để lật mở câu thơ này'}"
                  >
                    <span class="line-number-badge">${lIdx + 1}</span>
                    <div class="inkfader-words-wrapper">
                      ${words.map((word, wIdx) => {
                        const masked = maskInkFaderWord(word, inkFaderLevel, wIdx, words.length);
                        const isMasked = masked !== word && !isLineRevealed;
                        return `
                          <span class="inkfader-word ${isMasked ? 'word-hidden' : 'word-visible'}">
                            ${isLineRevealed ? word : masked}
                          </span>
                        `;
                      }).join('')}
                    </div>
                    <span class="inkfader-toggle-icon">
                      ${isLineRevealed ? `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A8754" stroke-width="2">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                          <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                      ` : `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A89B8C" stroke-width="2">
                          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                          <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                      `}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="impostor-controls">
            <button class="btn btn-secondary" onclick="switchGameMode('rescue')">← Về Giải cứu vần thơ</button>
            <button class="btn btn-secondary" onclick="setInkFaderLevel(${Math.max(1, inkFaderLevel - 1)})" ${inkFaderLevel === 1 ? 'disabled' : ''}>
              ◀ Cấp dễ hơn
            </button>
            <button class="btn ${inkFaderShowAll ? 'btn-amber' : 'btn-secondary'}" onclick="toggleInkFaderShowAll()">
              ${inkFaderShowAll ? '👁️‍🗨️ Che lại tất cả' : '👁️ Hiện tất cả'}
            </button>
            <button class="btn btn-secondary" onclick="initInkFaderGame()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              <span>Che lại</span>
            </button>
            <button class="btn btn-primary" onclick="setInkFaderLevel(${Math.min(4, inkFaderLevel + 1)})" ${inkFaderLevel === 4 ? 'disabled' : ''}>
              Cấp khó hơn ▶
            </button>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function setInkFaderLevel(lv) {
      inkFaderLevel = lv;
      inkFaderRevealed = new Set();
      inkFaderShowAll = false;
      sound.snap();
      renderInkFaderGame();
    }

    function toggleInkFaderLine(lIdx) {
      if (inkFaderRevealed.has(lIdx)) {
        inkFaderRevealed.delete(lIdx);
      } else {
        inkFaderRevealed.add(lIdx);
        sound.snap();
      }
      renderInkFaderGame();
    }

    function toggleInkFaderShowAll() {
      inkFaderShowAll = !inkFaderShowAll;
      sound.snap();
      renderInkFaderGame();
    }

    // 15. CHẾ ĐỘ MÁY CHIẾU & TOÀN MÀN HÌNH
    function toggleProjectorMode() {
      document.body.classList.toggle('projector-mode');
      const isProj = document.body.classList.contains('projector-mode');
      document.getElementById('txtProjector').textContent = isProj ? 'Máy chiếu: Bật' : 'Máy chiếu';
      const btn = document.getElementById('btnProjector');
      if (isProj) {
        btn.classList.add('btn-primary');
        btn.classList.remove('btn-secondary');
      } else {
        btn.classList.add('btn-secondary');
        btn.classList.remove('btn-primary');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    // Phím tắt bàn phím Ctrl+Z để Hoàn tác
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        handleUndo();
      }
    });

    // KHỞI ĐỘNG BAN ĐẦU
    window.addEventListener('DOMContentLoaded', () => {
      const poems = getStoredPoems();
      startPoem(poems[0]);
    });
